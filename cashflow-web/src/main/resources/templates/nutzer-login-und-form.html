<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login oder Registrierung</title>
  <style>
    :root { scrollbar-gutter: stable; }
    html { overflow-y: scroll; }
    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#f8fafc; /* leve */
      color:#111827;
    }

    /* Shell centralizada */
    .auth-shell{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }

    /* Topo: logo 3x maior que o do header */
    .logo{
      text-align:center;
      margin-bottom:24px;
    }
    .logo-title{
      margin:0;
      font-weight:800;
      letter-spacing:.2px;
      /* grande, responsivo — ~3x do normal */
      font-size: clamp(56px, 8vw, 108px);
      line-height:1.05;
    }
    .logo-dollar{ color:#D4AF37; }

    /* Grid dos formulários */
    .auth-grid{
      width:100%;
      max-width:960px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }
    @media (max-width: 820px){
      .auth-grid{ grid-template-columns:1fr; }
    }

    /* Cartõezinhos */
    .card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:18px;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
    }
    .card h2{
      margin:0 0 10px 0;
      font-size:1.25rem;
    }

    /* Form */
    label{ font-weight:600; display:block; margin:8px 0 4px; }
    input[type="text"],
    input[type="email"],
    input[type="password"]{
      width:100%;
      padding:10px 12px;
      border:1px solid #d1d5db;
      border-radius:10px;
      background:#fff;
      font:inherit;
    }
    .actions{ margin-top:12px; }
    button{
      appearance:none; border:0; cursor:pointer;
      padding:10px 14px; border-radius:10px;
      background:#10B981; color:#fff; font-weight:700;
    }
    button:hover{ filter:brightness(.95); }

    /* Mensagens */
    .status{ text-align:center; margin:8px 0 16px; }
    .ok{ color:#065f46; font-weight:700; }
    .err{ color:#b91c1c; font-weight:700; }
  </style>
</head>
<body>

  <main class="auth-shell">
    <div style="width:100%; max-width:1040px;">
      <!-- LOGO -->
      <div class="logo">
        <h1 class="logo-title">ca<span class="logo-dollar">$</span>hflow</h1>
      </div>

      <!-- Mensagens globais -->
      <div class="status">
        <p class="ok"  th:if="${successMessage}" th:text="${successMessage}"></p>
        <p class="err" th:if="${errorMessage}"   th:text="${errorMessage}"></p>
      </div>

      <!-- Formulários -->
      <div class="auth-grid">

        <!-- LOGIN -->
        <section class="card">
          <h2>Login</h2>
          <form id="login-form" th:action="@{/nutzer/login}" method="post">
            <label>Email</label>
            <input type="email" id="login-email" name="email" required />

            <label>Passwort</label>
            <input type="password" id="login-passwort" name="passwort" required />

            <div class="actions">
              <button type="submit" id="login-button">Login</button>
            </div>
          </form>
        </section>

        <!-- REGISTRO -->
        <section class="card">
          <h2>Registrierung</h2>
          <form th:action="@{/nutzer}" th:object="${nutzer}" method="post">
            <label>Vorname</label>
            <input type="text" th:field="*{vorname}" required />

            <label>Nachname</label>
            <input type="text" th:field="*{nachname}" required />

            <label>Email</label>
            <input type="email" th:field="*{email}" required />

            <label>Passwort</label>
            <input type="password" th:field="*{passwort}" required />

            <div class="actions">
              <button type="submit">Registrieren</button>
            </div>
          </form>
        </section>

      </div>
    </div>
  </main>

</body>
</html>
