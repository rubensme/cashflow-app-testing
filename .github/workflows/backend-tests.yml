name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Unit and API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            cashflow-app/pom.xml
            cashflow-web/pom.xml

      - name: Build core module
        run: mvn -B -f cashflow-app/pom.xml clean install

      - name: Run unit and API tests
        run: mvn -B -f cashflow-web/pom.xml test -DexcludedGroups=e2e