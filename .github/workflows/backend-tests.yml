name: CashFlow CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Unit and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            cashflow-app/pom.xml
            cashflow-web/pom.xml

      - name: Build core module
        run: mvn -B -f cashflow-app/pom.xml clean install

      - name: Run unit and API tests
        run: mvn -B -f cashflow-web/pom.xml test -DexcludedGroups=e2e

  selenium-tests:
    name: Responsive Selenium Tests
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            cashflow-app/pom.xml
            cashflow-web/pom.xml

      - name: Build core module
        run: mvn -B -f cashflow-app/pom.xml clean install

      - name: Start CashFlow application
        run: |
          mvn -B -f cashflow-web/pom.xml spring-boot:run > cashflow-web.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/status > /dev/null; then
              echo "CashFlow application is ready."
              exit 0
            fi
            sleep 2
          done

          echo "CashFlow application did not start."
          cat cashflow-web.log
          exit 1

      - name: Run responsive Selenium tests
        run: >
          mvn -B -f cashflow-web/pom.xml
          "-Dtest=NutzerSeleniumTest#sollteFormularLayoutAnViewportAnpassen"
          test
          
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag cashflow-web:ci .